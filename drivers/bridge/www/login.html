<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Smart Life Login</title>
<style>
	body { font-family: -apple-system, Segoe UI, sans-serif; margin: 1.5em; max-width: 34em; color: #222; }
	h2 { margin-top: 0; }
	label { display: block; margin: 1em 0 .3em; font-weight: 600; }
	input { font-size: 1em; padding: .4em .5em; width: 14em; }
	button { font-size: 1em; padding: .4em 1em; margin-left: .4em; cursor: pointer; }
	.hint, .small { color: #666; font-size: .9em; }
	#status { padding: .6em .8em; background: #f3f4f6; border-radius: 6px; }
	#qr svg { max-width: 100%; height: auto; margin-top: 1em; }
	.error { color: #b00020; }
</style>
</head>
<body>
<h2>Smart Life login</h2>
<p id="status">Checking&hellip;</p>
<form id="form">
	<label for="code">Smart Life User Code</label>
	<input id="code" autocomplete="off" spellcheck="false"><button type="submit">Show QR code</button>
	<p class="hint">In the Smart Life app: Me &rarr; Settings &rarr; Account and Security &rarr; User Code.</p>
</form>
<div id="qr"></div>
<p id="scan" class="small" hidden>Scan with the Smart Life app (Me &rarr; scan icon, top right) and confirm. The code is valid for 5 minutes.</p>
<script src="qrcode.js"></script>
<script>
// Opened by Composer (or openComposer) as a driver web tab: ?apihost=&driverid=&apitoken=.
// Talks to the controller's REST API; the bridge publishes the QR payload and its login
// status as the variables SMART_LIFE_QR and SMART_LIFE_STATUS.
(function () {
	var q = new URLSearchParams(location.search);
	var statusEl = document.getElementById('status');
	if (!q.get('apihost') || !q.get('driverid') || !q.get('apitoken')) {
		statusEl.textContent = 'Open this from the Tuya Bridge\'s "Smart Life Login" tab in Composer.';
		document.getElementById('form').hidden = true;
		return;
	}
	var item = 'https://' + q.get('apihost') + '/api/v1/items/' + encodeURIComponent(q.get('driverid'));
	var headers = { 'Authorization': 'Bearer ' + q.get('apitoken'), 'Content-Type': 'application/json' };
	var shown = null;

	function variables(list) {
		var out = {};
		(Array.isArray(list) ? list : (list && list.variables) || []).forEach(function (v) {
			out[v.varName || v.name] = v.value;
		});
		return out;
	}

	function draw(payload) {
		if (payload === shown) return;
		shown = payload;
		var el = document.getElementById('qr');
		document.getElementById('scan').hidden = !payload;
		if (!payload) { el.innerHTML = ''; return; }
		var qr = qrcode(0, 'M');
		qr.addData(payload);
		qr.make();
		el.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 4 });
	}

	function refresh() {
		fetch(item + '/variables?varnames=SMART_LIFE_QR,SMART_LIFE_STATUS', { headers: headers })
			.then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
			.then(function (j) {
				var v = variables(j);
				statusEl.textContent = v.SMART_LIFE_STATUS || 'Not signed in';
				statusEl.className = '';
				draw(v.SMART_LIFE_QR || null);
			})
			.catch(function (e) {
				statusEl.textContent = 'Could not reach the controller: ' + e.message;
				statusEl.className = 'error';
			});
	}

	document.getElementById('form').addEventListener('submit', function (ev) {
		ev.preventDefault();
		var code = document.getElementById('code').value.trim();
		if (!code) { statusEl.textContent = 'Enter your User Code first.'; return; }
		statusEl.textContent = 'Asking Tuya for a code…';
		fetch(item + '/commands', {
			method: 'POST', headers: headers,
			body: JSON.stringify({ async: true, command: 'SMART_LIFE_LOGIN', tParams: { USER_CODE: code } })
		}).then(function (r) {
			if (!r.ok) throw new Error('HTTP ' + r.status);
			setTimeout(refresh, 1500);
		}).catch(function (e) {
			statusEl.textContent = 'Could not start the login: ' + e.message;
			statusEl.className = 'error';
		});
	});

	refresh();
	setInterval(refresh, 2000);
})();
</script>
</body>
</html>
